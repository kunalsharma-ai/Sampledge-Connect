name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MONGO_URL: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known high/critical advisories in shipped (non-dev) dependencies fail the build.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration

  # WCAG 2.2 AA checks (axe-core) on the real app: API + web against Mongo and Redis.
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MONGO_URL: mongodb://localhost:27017
      MONGO_DB: sc_a11y
      REDIS_URL: redis://localhost:6379
      # One origin, as behind the gateway: the web server forwards /api/** to the API.
      PUBLIC_WEB_URL: http://localhost:3000
      API_PROXY_TARGET: http://localhost:4000
      # Many sign-ins from one address in a few minutes; limits are covered by API tests.
      RATE_LIMIT_DISABLED: 'true'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @sampledge/web exec playwright install --with-deps chromium
      - name: Start API and web
        run: |
          (cd apps/api && node dist/database/migrate-cli.js && (node dist/main.js > ../../api.log 2>&1 &))
          (cd apps/web && (NODE_ENV=production npx next start --port 3000 > ../../web.log 2>&1 &))
          for i in $(seq 60); do curl -sf localhost:3000/api/health/ready && curl -sf -o /dev/null localhost:3000/login && exit 0; sleep 2; done
          cat api.log web.log; exit 1
      - run: pnpm --filter @sampledge/web e2e
        env:
          WEB_URL: http://localhost:3000
          API_URL: http://localhost:3000/api
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: |
            apps/web/playwright-report
            api.log
            web.log
          retention-days: 7
