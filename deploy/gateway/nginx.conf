# SampConnect gateway (see docker-compose.yml and docs/deploy.md, "Networks and ports").
#
# One plain-HTTP site on port 80, reached by your reverse proxy over the `publicweb` network
# as http://gateway:80. The proxy owns the domain and the TLS certificate; nothing here does
# TLS, and no web port is published on the host.
#
#   /api/**  -> api:4000   (REST, Socket.IO at /api/socket.io, webhooks)
#   /rtc     -> LiveKit    (call signalling WebSocket; LiveKit shares this network namespace)
#   /        -> web:3000   (everything else)
#
# Web app, API and signalling share one origin, so the browser needs no CORS. The API answers
# only same-origin browsers (plus chat-widget sites configured in Integrations).
#
# Call media can't go through an HTTP proxy: LiveKit's UDP/TCP media ports (and the Jitsi
# bridge's) are the only ports the gateway publishes. Other listeners in this namespace:
# LiveKit 7880/7881/7882, Jitsi bridge 8080/9090/10000, Jitsi web on 8000 (optional, its own
# host name on your proxy) and the health check on 127.0.0.1:8099.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;

  # Docker's DNS. Upstreams are looked up per request, so the gateway starts before the
  # apps and keeps working when one of them is recreated with a new address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Requests that arrive from your own reverse proxy (on the publicweb network, or on this
  # host) carry the client's address in X-Forwarded-For. Take it from there so the API's
  # rate limits and audit log see the real client, then pass a single hop on, which the
  # API's `trust proxy 1` expects.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }
  map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    '' $http_host;
  }
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  # Uploads and recordings: the API enforces its own size limits.
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_http_version 1.1;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  proxy_set_header Host $http_host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-Host $forwarded_host;

  server {
    listen 80 default_server;
    server_name _;

    # The API. Its routes are mounted under /api, so the path passes through unchanged.
    location /api/ {
      set $upstream api:4000;
      proxy_pass http://$upstream;
    }
    location = /api {
      return 308 /api/;
    }

    # LiveKit signalling (WebSocket). Clients connect to wss://<your domain>/rtc.
    location /rtc {
      proxy_pass http://127.0.0.1:7880;
    }

    location / {
      set $upstream web:3000;
      proxy_pass http://$upstream;
    }
  }

  # Jitsi Meet (only answers when deploy/jitsi/docker-compose.jitsi.yml is in COMPOSE_FILE; see docs/jitsi.md).
  server {
    listen 8000;
    location / {
      set $upstream jitsi-web:80;
      proxy_pass http://$upstream;
    }
  }

  # Liveness for Docker's healthcheck.
  server {
    listen 127.0.0.1:8099;
    location = /healthz {
      return 200 'ok';
    }
  }
}
