# SampConnect gateway: the only container that publishes ports (see docker-compose.yml).
#
# It forwards the HTTP services to their containers on the internal network. The call
# servers (LiveKit, and Jitsi's video bridge when used) share this container's network, so
# their signalling and media ports are published by this container too, straight through
# Docker with no proxy hop in the media path.
#
# Listeners inside this container (keep them clear of LiveKit's 7880/7881/7882 and the
# Jitsi bridge's 8080/9090/10000, which live in the same network namespace):
#   3000 -> web:3000         4000 -> api:4000         8000 -> jitsi-web:80 (optional)
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;

  # Docker's DNS. Upstreams are looked up per request, so the gateway starts before the
  # apps and keeps working when one of them is recreated with a new address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Requests that arrive from your own reverse proxy (on the publicweb network, or on this
  # host) carry the client's address in X-Forwarded-For. Take it from there so the API's
  # rate limits and audit log see the real client, then pass a single hop on, which the
  # API's `trust proxy 1` expects.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }
  map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    '' $http_host;
  }
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  # Uploads and recordings: the API enforces its own size limits.
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_http_version 1.1;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  proxy_set_header Host $http_host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-Host $forwarded_host;

  server {
    listen 3000;
    location / {
      set $upstream web:3000;
      proxy_pass http://$upstream;
    }
  }

  server {
    listen 4000;
    location / {
      set $upstream api:4000;
      proxy_pass http://$upstream;
    }
  }

  # Jitsi Meet (only answers when deploy/jitsi/docker-compose.jitsi.yml is in COMPOSE_FILE; see docs/jitsi.md).
  server {
    listen 8000;
    location / {
      set $upstream jitsi-web:80;
      proxy_pass http://$upstream;
    }
  }

  # Liveness for Docker's healthcheck.
  server {
    listen 127.0.0.1:8099;
    location = /healthz {
      return 200 'ok';
    }
  }
}
