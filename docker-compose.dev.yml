# Local development only: MongoDB and Redis (plus an optional test mailbox) for `pnpm dev` and
# the integration tests, published on this machine's loopback. Needs no secrets.
#   docker compose -f docker-compose.dev.yml up -d                     # mongo + redis
#   docker compose -f docker-compose.dev.yml --profile mail-test up -d # + Mailpit on :8025
# Production uses docker-compose.yml, where only the gateway publishes ports. Change a port
# here (MONGO_PORT, REDIS_PORT, MAILPIT_PORT) if it is already taken on your machine, and
# point MONGO_URL / REDIS_URL at it.
name: sampconnect-dev
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ['127.0.0.1:${MONGO_PORT:-27017}:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 10s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s

  # Test mailbox: set SMTP_HOST=127.0.0.1 SMTP_PORT=1025 and read mail at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail-test]
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'

volumes:
  mongo-data:
  redis-data:
