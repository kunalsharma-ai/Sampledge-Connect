# Local development and single-server (VPS / LAN) deployment.
#   docker compose up -d mongo redis      # dependencies only, run apps with pnpm dev
#   docker compose up -d --build          # full stack
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 10s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'volatile-lru',
      ]
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY}
      # Calls: the API signs SFU join tokens and receives LiveKit webhooks.
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-sampledge}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET (openssl rand -base64 48)}
      # Call recording: egress writes finished files to the shared volume, the API moves them
      # into tenant storage. Remove these two lines to turn call recording off.
      RECORDINGS_SPOOL_DIR: /recordings
      LIVEKIT_EGRESS_OUTPUT_DIR: /out
      FILES_URL_SECRET: ${FILES_URL_SECRET:?set FILES_URL_SECRET (openssl rand -base64 48)}
      # Encrypts integration secrets stored in the database (SMTP, Stripe, SSO, AI, …).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY (openssl rand -base64 32)}
      # Public address of this API (SSO redirect URI, signed links).
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      # Prometheus scrape token for /health/metrics. Leave empty to turn the endpoint off.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Links in emails (guest join links) point here.
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      # Optional first-run default for email. After start, manage SMTP in Admin → Integrations
      # (stored encrypted in the database); these values only seed the platform default.
      # To try it locally: docker compose --profile mail-test up, then open http://localhost:8025.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes: [recordings-spool:/recordings]
    ports: ['${API_PORT:-4000}:4000']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Compiled into the browser bundle: the public addresses people's browsers use.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_RTC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
    restart: unless-stopped
    depends_on: [api]
    ports: ['${WEB_PORT:-3000}:3000']

  # Self-hosted SFU for voice/video calls and screen sharing (LiveKit, Apache-2.0).
  # Media goes browser/phone <-> this server only; no third-party media or STUN service is used.
  # On a VPS set LIVEKIT_NODE_IP to the server's public IP and open the ports below.
  # Every port is configurable in .env (LIVEKIT_*_PORT*). If `docker compose up` fails with
  # "address already in use", another program holds one of them: run scripts/check-ports.sh
  # and move the clashing range (see docs/deploy.md, "Port already in use").
  # Behind a strict firewall, enable TURN/TLS (see docs/calls.md).
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-sampledge}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}'
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: ${LIVEKIT_TCP_PORT:-7881}
          port_range_start: ${LIVEKIT_RTC_PORT_START:-50000}
          port_range_end: ${LIVEKIT_RTC_PORT_END:-50100}
          use_external_ip: false
          # Set LIVEKIT_NODE_IP to the host's real LAN/public IP. 127.0.0.1 only works for a
          # browser on this machine and breaks call recording (egress can't connect).
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        room:
          auto_create: false
          empty_timeout: 120
        turn:
          enabled: true
          udp_port: ${LIVEKIT_TURN_PORT:-3478}
          relay_range_start: ${LIVEKIT_TURN_RELAY_START:-50101}
          relay_range_end: ${LIVEKIT_TURN_RELAY_END:-50200}
        redis:
          address: redis:6379
        webhook:
          api_key: ${LIVEKIT_API_KEY:-sampledge}
          urls: ['http://api:4000/v1/calls/livekit/webhook']
        logging:
          level: info
    # Media ports are published on the same number inside and out, because LiveKit tells
    # browsers and phones to connect to exactly these ports on LIVEKIT_NODE_IP.
    ports:
      - '${LIVEKIT_HTTP_PORT:-7880}:7880'
      - '${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}'
      - '${LIVEKIT_TURN_PORT:-3478}:${LIVEKIT_TURN_PORT:-3478}/udp'
      - '${LIVEKIT_RTC_PORT_START:-50000}-${LIVEKIT_RTC_PORT_END:-50100}:${LIVEKIT_RTC_PORT_START:-50000}-${LIVEKIT_RTC_PORT_END:-50100}/udp'
      - '${LIVEKIT_TURN_RELAY_START:-50101}-${LIVEKIT_TURN_RELAY_END:-50200}:${LIVEKIT_TURN_RELAY_START:-50101}-${LIVEKIT_TURN_RELAY_END:-50200}/udp'

  # Self-hosted call/meeting recording (LiveKit Egress, Apache-2.0). Joins a call as a hidden
  # participant, renders the speaker layout (cameras + screen share) in its own headless Chrome
  # and writes an MP4/M4A into the shared spool volume. Needs ~2 CPU cores per recording.
  egress:
    image: livekit/egress:v1.11.0
    restart: unless-stopped
    depends_on: [livekit, redis, recordings-init]
    cap_add: [SYS_ADMIN] # Chrome sandbox
    shm_size: 1g # Chrome needs more than Docker's default 64 MB /dev/shm
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-sampledge}
        api_secret: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        health_port: 9090
        log_level: info
    volumes: [recordings-spool:/out]

  # Lets egress (uid 1001) write and the API (user app) read and remove spool files.
  recordings-init:
    image: alpine:3.22
    command: ['sh', '-c', 'chmod 0777 /recordings']
    volumes: [recordings-spool:/recordings]

  # Test mailbox for trying guest invites without a real mail server (only with
  # `--profile mail-test`). Set SMTP_HOST=mailpit SMTP_PORT=1025
  # SMTP_FROM="SampConnect <meetings@example.test>" and read mail at http://localhost:8025.
  # Nothing leaves this machine. Don't run it in production.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail-test]
    restart: unless-stopped
    ports: ['127.0.0.1:8025:8025']

  # ---- Jitsi Meet (optional second call engine, Apache-2.0), only with `--profile jitsi` ----
  # Self-hosted, branded as SampConnect (deploy/jitsi): SampConnect logo and name, no Jitsi
  # watermark or app promotion, no public STUN, gravatar or analytics. Every join is signed by
  # the API (JWT), so nobody can open a room without SampConnect. After `up`, connect it in
  # Admin → Integrations → Calls (Jitsi Meet): server URL = JITSI_PUBLIC_URL, app id and secret
  # below. See docs/jitsi.md. Open TCP ${JITSI_HTTP_PORT:-8000} (behind your TLS proxy) and
  # UDP ${JITSI_JVB_PORT:-10000}; set JITSI_ADVERTISE_IP to the server's public or LAN IP.
  jitsi-web:
    image: jitsi/web:stable-10314
    profiles: [jitsi]
    restart: unless-stopped
    depends_on: [jitsi-prosody]
    environment: &jitsi-env
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-http://localhost:8000}
      TZ: ${TZ:-UTC}
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
      JVB_HOST: jitsi-jvb
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_PASSWORD:?set JITSI_JICOFO_PASSWORD (openssl rand -hex 16)}
      JVB_AUTH_PASSWORD: ${JITSI_JVB_PASSWORD:?set JITSI_JVB_PASSWORD (openssl rand -hex 16)}
      ENABLE_AUTH: '1'
      AUTH_TYPE: jwt
      ENABLE_GUESTS: '0'
      JWT_APP_ID: ${JITSI_APP_ID:-sampconnect}
      JWT_APP_SECRET: ${JITSI_APP_SECRET:?set JITSI_APP_SECRET (openssl rand -base64 48)}
      JWT_ACCEPTED_ISSUERS: ${JITSI_APP_ID:-sampconnect}
      JWT_ACCEPTED_AUDIENCES: ${JITSI_APP_ID:-sampconnect}
      ENABLE_XMPP_WEBSOCKET: '1'
      ENABLE_COLIBRI_WEBSOCKET: '1'
      ENABLE_LETSENCRYPT: '0'
      DISABLE_HTTPS: '1'
      # Set JITSI_ENABLE_IPV6=0 on hosts without IPv6 (nginx won't start otherwise).
      ENABLE_IPV6: ${JITSI_ENABLE_IPV6:-1}
      ENABLE_HTTP_REDIRECT: '0'
      ENABLE_P2P: 'false'
      ENABLE_WELCOME_PAGE: 'false'
      ENABLE_CLOSE_PAGE: 'false'
      DISABLE_DEEP_LINKING: 'true'
      ENABLE_PREJOIN_PAGE: 'false'
      # Per-organization logo, colours and name inside the call, served by the API.
      BRANDING_DATA_URL: ${PUBLIC_API_URL:-http://localhost:4000}/v1/calls/jitsi/branding
      JVB_DISABLE_STUN: '1'
      JVB_ADVERTISE_IPS: ${JITSI_ADVERTISE_IP:-127.0.0.1}
      JVB_PORT: ${JITSI_JVB_PORT:-10000}
    volumes:
      - ./deploy/jitsi/custom-config.js:/config/custom-config.js:ro
      - ./deploy/jitsi/custom-interface_config.js:/config/custom-interface_config.js:ro
      - ./deploy/jitsi/title.html:/usr/share/jitsi-meet/title.html:ro
      - ./deploy/jitsi/branding/sampconnect-wordmark.svg:/usr/share/jitsi-meet/images/watermark.svg:ro
      - ./deploy/jitsi/branding/sampconnect-mark.svg:/usr/share/jitsi-meet/images/favicon.svg:ro
      - ./deploy/jitsi/branding/sampconnect-logo.png:/usr/share/jitsi-meet/images/sampconnect-logo.png:ro
      - ./deploy/jitsi/branding/sampconnect-logo.png:/usr/share/jitsi-meet/images/apple-touch-icon.png:ro
    ports: ['${JITSI_HTTP_PORT:-8000}:80']

  jitsi-prosody:
    image: jitsi/prosody:stable-10314
    profiles: [jitsi]
    restart: unless-stopped
    expose: ['5222', '5280']
    environment: *jitsi-env
    networks:
      default:
        aliases: [xmpp.meet.jitsi]

  jitsi-jicofo:
    image: jitsi/jicofo:stable-10314
    profiles: [jitsi]
    restart: unless-stopped
    depends_on: [jitsi-prosody]
    environment: *jitsi-env

  jitsi-jvb:
    image: jitsi/jvb:stable-10314
    profiles: [jitsi]
    restart: unless-stopped
    depends_on: [jitsi-prosody]
    environment: *jitsi-env
    ports: ['${JITSI_JVB_PORT:-10000}:${JITSI_JVB_PORT:-10000}/udp']

volumes:
  mongo-data:
  redis-data:
  recordings-spool:
