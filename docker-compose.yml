# Local development and single-server (VPS / LAN) deployment.
#   docker compose -f docker-compose.dev.yml up -d   # dev: mongo + redis only, for pnpm dev
#   docker compose up -d --build          # full stack
#
# Networks (see docs/deploy.md, "Networks and ports"):
#   internal   every service talks to every other here; nothing on it is published.
#   publicweb  shared with your own reverse proxy (Traefik, Caddy, nginx, …). Only the
#              gateway joins it, so the proxy reaches SampConnect as gateway:3000/4000/7880.
# Only the `gateway` service publishes host ports. The call servers share its network, so
# their media ports come from that one service too, and every port number is set in .env.
services:
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes: ['./deploy/gateway/nginx.conf:/etc/nginx/nginx.conf:ro']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8099/healthz']
      interval: 10s
      retries: 5
    networks:
      internal:
        # LiveKit (and the Jitsi bridge) run inside this container's network, so these
        # names reach them.
        aliases: [livekit, jitsi-jvb]
      publicweb: {}
    ports:
      # Web, API and call signalling. Set HTTP_BIND_IP=127.0.0.1 when a proxy on this host
      # (or on the publicweb network) is the only thing that should reach them.
      - '${HTTP_BIND_IP:-0.0.0.0}:${WEB_PORT:-3000}:3000'
      - '${HTTP_BIND_IP:-0.0.0.0}:${API_PORT:-4000}:4000'
      - '${HTTP_BIND_IP:-0.0.0.0}:${LIVEKIT_HTTP_PORT:-7880}:7880'
      # Call media (LiveKit). Same number inside and out: LiveKit tells browsers and phones
      # to connect to exactly these ports on LIVEKIT_NODE_IP. All media of every call is
      # multiplexed on the one UDP port, so there is no port range to clash with.
      - '${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}'
      - '${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp'
      - '${LIVEKIT_TURN_PORT:-3478}:${LIVEKIT_TURN_PORT:-3478}/udp'
      # TURN relay range, only used by callers behind strict NAT. Its default sits below
      # 32768, the start of the ports Linux, macOS and Windows hand out to other programs,
      # so it doesn't collide by chance. Change both ends in .env.
      - '${LIVEKIT_TURN_RELAY_START:-30000}-${LIVEKIT_TURN_RELAY_END:-30100}:${LIVEKIT_TURN_RELAY_START:-30000}-${LIVEKIT_TURN_RELAY_END:-30100}/udp'

  mongo:
    image: mongo:7
    restart: unless-stopped
    networks: [internal]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 10s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'volatile-lru',
      ]
    networks: [internal]
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY}
      # Calls: the API signs SFU join tokens and receives LiveKit webhooks.
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-sampledge}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET (openssl rand -base64 48)}
      # Call recording: egress writes finished files to the shared volume, the API moves them
      # into tenant storage. Remove these two lines to turn call recording off.
      RECORDINGS_SPOOL_DIR: /recordings
      LIVEKIT_EGRESS_OUTPUT_DIR: /out
      FILES_URL_SECRET: ${FILES_URL_SECRET:?set FILES_URL_SECRET (openssl rand -base64 48)}
      # Encrypts integration secrets stored in the database (SMTP, Stripe, SSO, AI, …).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?set SETTINGS_ENCRYPTION_KEY (openssl rand -base64 32)}
      # Public address of this API (SSO redirect URI, signed links).
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      # Prometheus scrape token for /health/metrics. Leave empty to turn the endpoint off.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Links in emails (guest join links) point here.
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      # Optional first-run default for email. After start, manage SMTP in Admin → Integrations
      # (stored encrypted in the database); these values only seed the platform default.
      # To try it locally: docker compose --profile mail-test up, then open http://localhost:8025.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes: [recordings-spool:/recordings]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Compiled into the browser bundle: the public addresses people's browsers use.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_RTC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]

  # Self-hosted SFU for voice/video calls and screen sharing (LiveKit, Apache-2.0).
  # Media goes browser/phone <-> this server only; no third-party media or STUN service is used.
  # On a VPS set LIVEKIT_NODE_IP to the server's public IP and open the gateway's call ports.
  # It runs inside the gateway's network (reachable as livekit:7880 on the internal network),
  # so it publishes nothing itself. Every port is configurable in .env (LIVEKIT_*_PORT). If
  # `docker compose up` fails with "address already in use", run scripts/check-ports.sh and
  # move the clashing port (see docs/deploy.md, "Port already in use").
  # Behind a strict firewall, enable TURN/TLS (see docs/calls.md).
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    network_mode: service:gateway
    depends_on: [gateway]
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-sampledge}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}'
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: ${LIVEKIT_TCP_PORT:-7881}
          # One UDP port carries the media of every call (ICE/UDP mux).
          udp_port: ${LIVEKIT_UDP_PORT:-7882}
          use_external_ip: false
          # Set LIVEKIT_NODE_IP to the host's real LAN/public IP. 127.0.0.1 only works for a
          # browser on this machine and breaks call recording (egress can't connect).
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        room:
          auto_create: false
          empty_timeout: 120
        turn:
          enabled: true
          udp_port: ${LIVEKIT_TURN_PORT:-3478}
          # Published by the gateway (see its ports).
          relay_range_start: ${LIVEKIT_TURN_RELAY_START:-30000}
          relay_range_end: ${LIVEKIT_TURN_RELAY_END:-30100}
        redis:
          address: redis:6379
        webhook:
          api_key: ${LIVEKIT_API_KEY:-sampledge}
          urls: ['http://api:4000/v1/calls/livekit/webhook']
        logging:
          level: info

  # Self-hosted call/meeting recording (LiveKit Egress, Apache-2.0). Joins a call as a hidden
  # participant, renders the speaker layout (cameras + screen share) in its own headless Chrome
  # and writes an MP4/M4A into the shared spool volume. Needs ~2 CPU cores per recording.
  egress:
    image: livekit/egress:v1.11.0
    restart: unless-stopped
    depends_on: [livekit, redis, recordings-init]
    networks: [internal]
    cap_add: [SYS_ADMIN] # Chrome sandbox
    shm_size: 1g # Chrome needs more than Docker's default 64 MB /dev/shm
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-sampledge}
        api_secret: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        health_port: 9090
        log_level: info
    volumes: [recordings-spool:/out]

  # Lets egress (uid 1001) write and the API (user app) read and remove spool files.
  recordings-init:
    image: alpine:3.22
    command: ['sh', '-c', 'chmod 0777 /recordings']
    network_mode: none
    volumes: [recordings-spool:/recordings]

  # Test mailbox for trying guest invites without a real mail server (only with
  # `--profile mail-test`). Set SMTP_HOST=mailpit SMTP_PORT=1025
  # SMTP_FROM="SampConnect <meetings@example.test>" and read mail at http://localhost:8025.
  # Nothing leaves this machine. Don't run it in production; it is the one exception to "only
  # the gateway publishes ports", on loopback only and never started without the profile.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail-test]
    restart: unless-stopped
    networks: [internal]
    ports: ['127.0.0.1:${MAILPIT_PORT:-8025}:8025']

  # Jitsi Meet (optional second call engine) lives in deploy/jitsi/docker-compose.jitsi.yml,
  # so its secrets are only needed when you use it. See docs/jitsi.md.

networks:
  internal: {}
  # Your reverse proxy's network. Compose creates it when it doesn't exist yet. If your proxy
  # already made one (`docker network create publicweb`), set PUBLIC_NETWORK_EXTERNAL=true so
  # SampConnect joins it instead; PUBLIC_NETWORK picks another name.
  publicweb:
    name: ${PUBLIC_NETWORK:-publicweb}
    external: ${PUBLIC_NETWORK_EXTERNAL:-false}

volumes:
  mongo-data:
  redis-data:
  recordings-spool:
